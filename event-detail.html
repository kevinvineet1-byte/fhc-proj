<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Details — FHC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

  :root{
    --pink:#FF1B7A;
    --pink-deep:#E4106A;
    --yellow:#FFC93C;
    --black:#0A0A0A;
    --panel:#121212;
    --cream:#F4EFE3;
    --blue:#3AA6FF;
    --green:#39C46B;
    --purple:#9B6BFF;
    --red:#FF5C5C;
    --grey:#8B8B8B;
    --pixel-font:'Press Start 2P', monospace;
    --mono-font:'VT323', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ image-rendering:pixelated; scroll-behavior:smooth; }

  body{
    background:var(--black);
    color:var(--cream);
    font-family:var(--mono-font);
    font-size:19px;
    line-height:1.5;
  }

  /* ---------- outer frame ---------- */
  .frame{
    border:6px solid var(--pink);
    min-height:100vh;
    position:relative;
  }
  .frame::before{
    content:"";
    position:absolute; inset:10px;
    border:2px dashed rgba(255,27,122,.35);
    pointer-events:none;
    z-index:1;
  }

  img, svg{ image-rendering:pixelated; }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  .pixel-font{ font-family:var(--pixel-font); }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:16px 28px;
    background:var(--black);
    border-bottom:4px solid var(--pink);
    position:sticky;
    top:0;
    z-index:50;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-badge{
    border:3px solid var(--pink);
    background:var(--black);
    padding:8px 14px;
    box-shadow:3px 3px 0 var(--pink);
  }
  .brand-badge .fhc{
    font-family:var(--pixel-font);
    color:var(--pink);
    font-size:22px;
    letter-spacing:1px;
  }
  .brand-sub{
    font-family:var(--pixel-font);
    font-size:9px;
    color:var(--cream);
    line-height:1.6;
    letter-spacing:.5px;
  }

  nav{
    display:flex;
    align-items:center;
    gap:26px;
    font-family:var(--pixel-font);
    font-size:11px;
    flex-wrap:wrap;
  }
  nav a{
    color:var(--cream);
    padding:6px 4px;
    position:relative;
    white-space:nowrap;
  }
  nav a:hover{ color:var(--yellow); }
  nav a.play::before{
    content:"▶ ";
    color:var(--pink);
  }
  nav a.active{
    background:var(--black);
    border:2px solid var(--cream);
    padding:8px 12px;
  }

  .join-btn{
    font-family:var(--pixel-font);
    font-size:11px;
    background:var(--cream);
    color:var(--black);
    border:2px solid var(--cream);
    padding:10px 18px;
  }
  .join-btn:hover{ background:var(--yellow); border-color:var(--yellow); }

  /* ---------- content ---------- */
  .content{
    max-width:900px;
    margin:0 auto;
    padding:40px 28px;
    position:relative;
    z-index:2;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:var(--pixel-font);
    font-size:12px;
    color:var(--yellow);
    margin-bottom:30px;
    padding:8px 12px;
    border:2px solid var(--yellow);
    transition:all .2s ease;
  }
  .back-link:hover{
    background:var(--yellow);
    color:var(--black);
  }

  .event-header{
    border:3px solid var(--pink);
    background:var(--panel);
    padding:30px;
    margin-bottom:30px;
    box-shadow:6px 6px 0 var(--pink-deep);
  }

  .event-tag{
    display:inline-block;
    font-family:var(--pixel-font);
    font-size:10px;
    padding:8px 12px;
    margin-bottom:15px;
    border:2px solid var(--black);
    letter-spacing:.5px;
  }
  .event-tag.workshop{ background:var(--blue); color:var(--black); }
  .event-tag.hackathon{ background:var(--green); color:var(--black); }
  .event-tag.talk{ background:var(--yellow); color:var(--black); }
  .event-tag.event{ background:var(--pink); color:var(--black); }
  .event-tag.social{ background:var(--purple); color:var(--cream); }

  .event-title{
    font-family:'Georgia', 'Times New Roman', serif;
    font-style:italic;
    font-weight:700;
    font-size:48px;
    line-height:1.05;
    color:var(--cream);
    margin-bottom:20px;
  }

  .event-meta{
    display:flex;
    flex-direction:column;
    gap:12px;
    font-size:18px;
    color:#B8B8B8;
  }
  .meta-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .meta-label{
    font-family:var(--pixel-font);
    font-size:11px;
    color:var(--yellow);
    min-width:60px;
  }

  .event-description{
    border:3px solid var(--pink);
    background:var(--panel);
    padding:30px;
    margin-bottom:30px;
    line-height:1.8;
    font-size:18px;
    color:#D0D0D0;
  }

  .event-description h3{
    font-family:var(--pixel-font);
    font-size:14px;
    color:var(--yellow);
    margin-bottom:15px;
    letter-spacing:1px;
  }

  .event-description p{
    margin-bottom:15px;
  }
  .event-description p:last-child{
    margin-bottom:0;
  }

  .event-details-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:30px;
  }

  .detail-card{
    border:3px solid var(--pink);
    background:var(--panel);
    padding:20px;
  }

  .detail-card h4{
    font-family:var(--pixel-font);
    font-size:12px;
    color:var(--yellow);
    margin-bottom:10px;
    letter-spacing:1px;
  }

  .detail-card p{
    font-size:17px;
    color:#B8B8B8;
  }

  .cta-section{
    border:3px solid var(--green);
    background:var(--black);
    padding:30px;
    text-align:center;
  }

  .cta-section h3{
    font-family:var(--pixel-font);
    font-size:16px;
    color:var(--green);
    margin-bottom:15px;
  }

  .register-btn{
    font-family:var(--pixel-font);
    font-size:13px;
    background:var(--green);
    color:var(--black);
    border:3px solid var(--green);
    padding:14px 28px;
    box-shadow:4px 4px 0 var(--black);
    transition:all .2s ease;
    margin-bottom:15px;
  }
  .register-btn:hover{
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 var(--black);
  }

  .register-note{
    font-size:15px;
    color:#888;
    font-family:var(--mono-font);
  }

  /* ---------- footer ---------- */
  footer{
    margin-top:50px;
    border-top:4px solid var(--pink);
    padding:22px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    font-family:var(--mono-font);
    font-size:17px;
  }

  .fhc-mark{
    width:58px; height:58px;
    border:2px solid var(--pink);
    border-radius:50%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    font-family:var(--pixel-font);
    color:var(--pink);
    font-size:11px;
    line-height:1.3;
  }
  .fhc-mark span{ font-size:7px; color:var(--cream); }

  /* ---------- responsive ---------- */
  @media (max-width:720px){
    header{ flex-direction:column; align-items:flex-start; }
    nav{ font-size:10px; gap:14px; }
    .content{ padding:20px 16px; }
    .event-title{ font-size:32px; }
    .event-details-grid{ grid-template-columns:1fr; }
    .event-header, .event-description, .detail-card{ padding:20px; }
    footer{ flex-direction:column; align-items:flex-start; }
  }

  /* Loading state */
  .loading{
    text-align:center;
    padding:60px 20px;
    font-size:20px;
    color:var(--grey);
  }

  .error{
    border:3px solid var(--red);
    background:var(--black);
    color:var(--red);
    padding:30px;
    margin:30px 0;
    text-align:center;
  }
</style>
</head>
<body>

<div class="frame">

  <header>
    <div class="brand">
      <div class="brand-badge"><span class="fhc pixel-font">FHC</span></div>
      <div class="brand-sub">FULL FISAT<br>HORIZON CLUB</div>
    </div>
    <nav>
      <a href="test3.html" class="play">HOME</a>
      <a href="test3.html" class="active">EVENTS</a>
      <a href="#">PROJECTS</a>
      <a href="#">TEAM</a>
      <a href="#">GALLERY</a>
      <a href="#">ABOUT</a>
    </nav>
    <a href="#" class="join-btn">JOIN</a>
  </header>

  <div class="content">
    <a href="test3.html" class="back-link">← BACK TO EVENTS</a>

    <div id="eventContainer">
      <div class="loading">Loading event details...</div>
    </div>
  </div>

  <footer>
    <div class="fhc-mark">FHC<span>v2.6</span></div>
  </footer>

</div>

<script>
  /* Event data with detailed descriptions */
  const EVENTS = [
    {
      id:1, status:'upcoming', category:'workshop', tag:'WORKSHOP', icon:'💻',
      title:'Web Dev Workshop', date:'JUN 15, 2026', time:'10:00 AM',
      location:'Lab 3, CSE Block', price:'FREE',
      shortDesc:'Hands-on session on modern web development — HTML, CSS, JS and your first deploy.',
      fullDesc:'Join us for an intensive hands-on workshop where we\'ll dive deep into modern web development. Learn the essentials of HTML, CSS, and JavaScript, and build your first real project. We\'ll cover responsive design, best practices, and deployment strategies. Perfect for beginners and those looking to level up their skills.',
      agenda:[
        '10:00 AM - Introduction & Setup',
        '10:30 AM - HTML & CSS Fundamentals',
        '11:30 AM - JavaScript Basics',
        '1:00 PM - Building a Real Project',
        '2:30 PM - Deployment & Q&A'
      ],
      prerequisites:'Basic computer knowledge. No prior coding experience needed.'
    },
    {
      id:2, status:'upcoming', category:'talk', tag:'TECH TALK', icon:'💬',
      title:'AI Explorer Talk', date:'JUN 28, 2026', time:'2:00 PM',
      location:'Main Seminar Hall', price:'FREE',
      shortDesc:'A session on the future of AI and its real-world applications, with live Q&A.',
      fullDesc:'Explore the cutting edge of artificial intelligence and machine learning. We\'ll discuss how AI is transforming various industries, from healthcare to finance, and what the future holds. Featuring insights from industry experts and live demonstrations of AI in action. Join us for an engaging Q&A session.',
      agenda:[
        '2:00 PM - What is AI? Fundamentals Explained',
        '2:30 PM - AI in Real-World Applications',
        '3:15 PM - Machine Learning Deep Dive',
        '4:00 PM - Future of AI & Ethics',
        '4:30 PM - Live Q&A with Experts'
      ],
      prerequisites:'Interest in technology. No prior AI knowledge required.'
    },
    {
      id:3, status:'upcoming', category:'hackathon', tag:'HACKATHON', icon:'🏆',
      title:'Code Horizon 3.0', date:'JUL 10, 2026', time:'9:00 AM',
      location:'IDEA Lab, FISAT', price:'₹99',
      shortDesc:'Intra-college coding competition. Solve. Code. Win. Repeat. 24 hours on the clock.',
      fullDesc:'Code Horizon 3.0 is back and bigger than ever! A thrilling 24-hour intra-college hackathon where teams compete to solve real-world problems with code. Work alongside the brightest minds, get mentorship from industry experts, and win amazing prizes. Whether you\'re a coding newbie or a seasoned hacker, there\'s a challenge for you.',
      agenda:[
        '9:00 AM - Registration & Team Formation',
        '10:00 AM - Problem Statements Revealed',
        '10:30 AM - Hacking Begins!',
        '12:00 PM - Lunch Break',
        '3:00 PM - Code Review Checkpoint',
        '9:00 AM (Next Day) - Final Submissions',
        '10:00 AM - Judging & Awards'
      ],
      prerequisites:'Basic programming knowledge. Teams can have 2-4 members.'
    },
    {
      id:4, status:'upcoming', category:'talk', tag:'TECH TALK', icon:'🎤',
      title:'Industry Career Talk', date:'JUL 24, 2026', time:'11:00 AM',
      location:'Auditorium', price:'FREE',
      shortDesc:'Talk by industry experts on emerging tech and career guidance for students.',
      fullDesc:'Get insider perspectives from professionals working at leading tech companies. They\'ll share their career journeys, discuss emerging technologies, and provide practical advice for landing your dream job. Learn about different career paths in tech, skill requirements, and how to stand out in the competitive job market.',
      agenda:[
        '11:00 AM - Speaker Introductions',
        '11:15 AM - Career Paths in Tech',
        '11:45 AM - Emerging Technologies 2026',
        '12:15 PM - Getting Hired: Tips & Tricks',
        '12:45 PM - Open Floor Q&A',
        '1:30 PM - Networking & Coffee'
      ],
      prerequisites:'All students welcome. Bring your resume if interested!'
    },
    {
      id:5, status:'upcoming', category:'workshop', tag:'WORKSHOP', icon:'🔐',
      title:'Cyber Security 101', date:'AUG 02, 2026', time:'10:30 AM',
      location:'Lab 2, CSE Block', price:'₹49',
      shortDesc:'Intro to ethical hacking, common exploits, and how to defend against them.',
      fullDesc:'Learn the fundamentals of cybersecurity and ethical hacking. We\'ll explore common vulnerabilities, how hackers exploit them, and most importantly, how to defend your systems. Gain hands-on experience with penetration testing tools and real-world security scenarios. Perfect for aspiring security professionals.',
      agenda:[
        '10:30 AM - Cybersecurity Basics',
        '11:00 AM - Common Vulnerabilities & Exploits',
        '11:45 AM - Ethical Hacking Tools Demo',
        '12:30 PM - Lunch Break',
        '1:15 PM - Hands-On Lab',
        '2:30 PM - Defense Strategies',
        '3:00 PM - Certification & Q&A'
      ],
      prerequisites:'Basic networking knowledge. Bring your laptop.'
    },
    {
      id:6, status:'upcoming', category:'social', tag:'FUN MOMENTS', icon:'🎮',
      title:'FHC Game Night', date:'AUG 14, 2026', time:'6:00 PM',
      location:'Student Lounge', price:'FREE',
      shortDesc:'Because the best memories happen off the screen. Snacks, games, good company.',
      fullDesc:'Unwind after a long week with FHC Game Night! Join your fellow members for an evening of fun, games, competition, and camaraderie. From board games to video games, trivia to card games — there\'s something for everyone. Enjoy snacks, make new friends, and create unforgettable memories.',
      agenda:[
        '6:00 PM - Arrival & Snacks',
        '6:30 PM - Board Games & Group Activities',
        '7:30 PM - Video Game Tournament',
        '8:30 PM - Trivia Challenge',
        '9:00 PM - Prize Distribution & Wrap-up'
      ],
      prerequisites:'None! Just bring yourself and your competitive spirit.'
    },
    {
      id:7, status:'past', category:'event', tag:'EVENT', icon:'🤖',
      title:'IDEA Lab Launch', date:'MAR 10, 2026', time:'10:30 AM',
      location:'Main Seminar Hall, FISAT', price:'FREE',
      shortDesc:'The official inauguration of the AICTE IDEA Lab, celebrating a new space for creativity and innovation.',
      fullDesc:'A landmark event celebrating the inauguration of FISAT\'s new AICTE IDEA Lab. This state-of-the-art facility marks a major milestone in our campus\'s commitment to innovation and entrepreneurship. The event featured keynote speeches from tech leaders, facility tours, and networking with industry professionals.',
      agenda:[
        '10:30 AM - Welcome & Opening Remarks',
        '11:00 AM - Keynote Speech',
        '11:45 AM - Facility Tour',
        '12:30 PM - Lunch & Networking',
        '2:00 PM - Project Showcase'
      ],
      prerequisites:'N/A - This is a past event.'
    },
    {
      id:8, status:'past', category:'hackathon', tag:'HACKATHON', icon:'🏆',
      title:'Code Horizon 2.0', date:'NOV 18, 2025', time:'9:00 AM',
      location:'IDEA Lab, FISAT', price:'₹45',
      shortDesc:'24 hours of code, coffee and collaboration across 40+ teams.',
      fullDesc:'Code Horizon 2.0 was an incredible success with over 40 teams competing for 24 hours straight. The event brought together talented developers, designers, and innovators who built amazing solutions to real-world problems. With mentorship, pizza, energy drinks, and endless coffee, it was an unforgettable experience.',
      agenda:[
        '9:00 AM - Kickoff & Problem Statements',
        '10:00 AM - Hacking Begins',
        '12:00 PM - Lunch',
        '3:00 PM - Mid-point Checkpoint',
        '9:00 AM (Next Day) - Final Submissions',
        '10:00 AM - Judging & Awards'
      ],
      prerequisites:'N/A - This is a past event.'
    },
    {
      id:9, status:'past', category:'event', tag:'EVENT', icon:'❤',
      title:'Code For Good', date:'OCT 05, 2025', time:'8:00 AM',
      location:'FISAT Campus', price:'FREE',
      shortDesc:'Using technology to make a positive impact — a day of community-driven builds.',
      fullDesc:'Code For Good was a special event focused on using technology for social good. Teams built projects aimed at solving real community problems, from education to healthcare. This event demonstrated that technology can be a powerful tool for positive change and that developers have a responsibility to use their skills for the greater good.',
      agenda:[
        '8:00 AM - Registration & Orientation',
        '9:00 AM - Social Impact Talks',
        '10:00 AM - Team Formation & Ideation',
        '1:00 PM - Lunch Break',
        '2:00 PM - Development Continues',
        '5:00 PM - Project Presentations',
        '6:00 PM - Awards & Celebration'
      ],
      prerequisites:'N/A - This is a past event.'
    }
  ];

  // Get event ID from URL
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = parseInt(urlParams.get('id'), 10);
  const event = EVENTS.find(e => e.id === eventId);

  function renderEvent(){
    const container = document.getElementById('eventContainer');

    if(!event){
      container.innerHTML = `
        <div class="error">
          <h2>Event Not Found</h2>
          <p>Sorry, we couldn't find the event you're looking for.</p>
          <a href="test3.html" class="back-link" style="margin-top:20px;">← BACK TO EVENTS</a>
        </div>
      `;
      return;
    }

    const statusClass = event.status === 'past' ? 'past' : 'upcoming';
    const tagClass = {workshop:'workshop', hackathon:'hackathon', talk:'talk', event:'event', social:'social'}[event.category] || 'event';

    container.innerHTML = `
      <div class="event-header">
        <span class="event-tag ${tagClass}">${event.tag}</span>
        <h1 class="event-title">${event.title}</h1>
        <div class="event-meta">
          <div class="meta-row">
            <span class="meta-label">📅 DATE</span>
            <span>${event.date} · ${event.time}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">📍 LOCATION</span>
            <span>${event.location}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">💰 PRICE</span>
            <span>${/free/i.test(event.price) ? 'FREE' : event.price}</span>
          </div>
          <div class="meta-row">
            <span class="meta-label">📊 STATUS</span>
            <span>${event.status === 'past' ? 'CONCLUDED' : 'UPCOMING'}</span>
          </div>
        </div>
      </div>

      <div class="event-description">
        <h3>ABOUT THIS EVENT</h3>
        <p>${event.fullDesc}</p>
      </div>

      <div class="event-details-grid">
        <div class="detail-card">
          <h4>AGENDA</h4>
          <div style="font-size:16px; line-height:1.8;">
            ${event.agenda.map(item => `<p>• ${item}</p>`).join('')}
          </div>
        </div>
        <div class="detail-card">
          <h4>PREREQUISITES</h4>
          <p>${event.prerequisites}</p>
        </div>
      </div>

      ${event.status === 'upcoming' ? `
        <div class="cta-section">
          <h3>READY TO JOIN?</h3>
          <button class="register-btn" onclick="alert('Registration will open soon!')">REGISTER NOW →</button>
          <p class="register-note">Spots are limited. Register early to secure your seat!</p>
        </div>
      ` : `
        <div class="cta-section">
          <h3>THIS EVENT HAS CONCLUDED</h3>
          <p class="register-note">Thank you for attending! Check back for photos and updates.</p>
        </div>
      `}
    `;
  }

  // Render on page load
  renderEvent();
</script>

</body>
</html>
